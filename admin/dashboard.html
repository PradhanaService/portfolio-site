<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Munish Prabhu K</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../responsive.css" />
  <style>
    body {
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .tab {
      padding: 10px 20px;
      background: #101520;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font: 500 14px 'DM Mono', monospace;
    }
    .tab.active {
      background: rgba(120, 169, 255, 0.1);
      border-color: var(--blue);
      color: #fff;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .list-item {
      background: #101520;
      border: 1px solid var(--line);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .list-item h4 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    .list-item p {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .actions-btn {
      display: flex;
      gap: 10px;
    }
    .btn-small {
      padding: 6px 12px;
      background: #1a2333;
      border: 1px solid #2d3b55;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-small.danger {
      background: #3d1b1b;
      border-color: #5c2424;
      color: #ff8a8a;
    }
    .form-container {
      background: #0b0f18;
      border: 1px solid var(--line);
      padding: 25px;
      border-radius: 8px;
      margin-top: 30px;
    }
    .form-container h3 {
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font: 12px 'DM Mono', monospace;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      background: #101520;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Manrope', sans-serif;
    }
    .form-group input[type="checkbox"] {
      width: auto;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .repeatable-editor {
      display: grid;
      gap: 10px;
    }
    .repeatable-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
      gap: 9px;
      align-items: start;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101520;
    }
    .repeatable-row.outcome-row { grid-template-columns: 92px 1fr 1fr auto; }
    .repeatable-row textarea { min-height: 42px; }
    .repeatable-add { margin-top: 10px; }
    @media (max-width: 620px) {
      .repeatable-row, .repeatable-row.outcome-row { grid-template-columns: 1fr; }
    }
    .desc-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .desc-toolbar-btn {
      padding: 5px 12px;
      background: #1a2333;
      border: 1px solid rgba(120, 169, 255, 0.3);
      border-radius: 6px;
      color: var(--blue);
      font: 500 12px 'DM Mono', monospace;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .desc-toolbar-btn:hover {
      background: rgba(120, 169, 255, 0.15);
      border-color: var(--blue);
    }
    .desc-toolbar-label {
      font: 500 11px 'DM Mono', monospace;
      color: var(--muted);
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Admin Dashboard</h2>
    <button id="logout-btn" class="btn-small">Log out</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-target="work-tab">Work Items</div>
    <div class="tab" data-target="exp-tab">Experience Items</div>
  </div>

  <!-- Work Tab -->
  <div id="work-tab" class="tab-content active">
    <h3>Work Items</h3>
    <div id="work-list">Loading...</div>

    <div class="form-container">
      <h3 id="work-form-title">Add New Work</h3>
      <form id="work-form">
        <input type="hidden" id="work-id" />
        <div class="form-group">
          <label>Order (Number)</label>
          <input type="number" id="work-order" required />
        </div>
        <div class="form-group">
          <label>Tag Line (e.g. MARKET RESEARCH / BRAND)</label>
          <input type="text" id="work-tag" required />
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="work-title" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="work-desc" required></textarea>
        </div>
        <div class="form-group">
          <label>Client name (shown on project detail)</label>
          <input type="text" id="work-client" />
        </div>
        <div class="form-group">
          <label>Project overview (optional; falls back to Description)</label>
          <textarea id="work-overview"></textarea>
        </div>
        <div class="form-group">
          <label>Duration (optional)</label>
          <input type="text" id="work-duration" placeholder="e.g. 4 weeks" />
        </div>
        <div class="form-group">
          <label>Live site URL (optional)</label>
          <input type="url" id="work-live-url" placeholder="https://example.com" />
        </div>
        <div class="form-group">
          <label>Review portal URL (optional)</label>
          <input type="url" id="work-review-url" placeholder="https://example.com/review" />
        </div>
        <div class="form-group">
          <label>Challenge</label>
          <textarea id="work-challenge" placeholder="Describe the challenge this project needed to solve."></textarea>
        </div>
        <div class="form-group">
          <label>Our Approach</label>
          <textarea id="work-approach" placeholder="Describe the approach taken for this project."></textarea>
        </div>
        <div class="form-group">
          <label>How we got there — process steps</label>
          <div id="work-process-steps" class="repeatable-editor"></div>
          <button type="button" id="add-process-step" class="btn-small repeatable-add">+ Add process step</button>
        </div>
        <div class="form-group">
          <label>Project outcomes</label>
          <div id="work-outcomes" class="repeatable-editor"></div>
          <button type="button" id="add-outcome" class="btn-small repeatable-add">+ Add outcome</button>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="work-large" /> Is Large Featured Card?</label>
        </div>
        <div class="form-group">
          <label>Link URL (Optional, e.g. index.html#contact)</label>
          <input type="text" id="work-link-url" />
        </div>
        <div class="form-group">
          <label>Link Label (Optional, e.g. Discuss a project)</label>
          <input type="text" id="work-link-label" />
        </div>
        <button type="submit" class="button">Save Work</button>
        <button type="button" class="btn-small" onclick="resetWorkForm()" style="margin-left: 10px;">Cancel Edit</button>
      </form>
    </div>
  </div>

  <!-- Experience Tab -->
  <div id="exp-tab" class="tab-content">
    <h3>Experience Items</h3>
    <div id="exp-list">Loading...</div>

    <div class="form-container">
      <h3 id="exp-form-title">Add New Experience</h3>
      <form id="exp-form">
        <input type="hidden" id="exp-id" />
        <div class="form-group">
          <label>Order (Number)</label>
          <input type="number" id="exp-order" required />
        </div>
        <div class="form-group">
          <label>Date Range (e.g. Sep 2025 — Apr 2026)</label>
          <input type="text" id="exp-date" required />
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="exp-title" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <div class="desc-toolbar">
            <span class="desc-toolbar-label">Bullet points:</span>
            <button type="button" class="desc-toolbar-btn" onclick="insertBullet('exp-desc')">• Insert bullet</button>
            <button type="button" class="desc-toolbar-btn" onclick="formatAsBullets('exp-desc')">Format all as bullets</button>
            <button type="button" class="desc-toolbar-btn" onclick="clearBullets('exp-desc')">Clear bullets</button>
          </div>
          <textarea id="exp-desc" required style="min-height: 140px;"></textarea>
        </div>
        <button type="submit" class="button">Save Experience</button>
        <button type="button" class="btn-small" onclick="resetExpForm()" style="margin-left: 10px;">Cancel Edit</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../supabase-config.js';
    document.addEventListener('DOMContentLoaded', async () => {
      // Auth Check
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
      });

      // Tabs Logic
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.getAttribute('data-target')).classList.add('active');
        });
      });

      function addRepeatableRow(containerId, type, value = {}) {
        const container = document.getElementById(containerId);
        const row = document.createElement('div');
        row.className = `repeatable-row ${type === 'outcome' ? 'outcome-row' : ''}`;
        const fields = type === 'outcome'
          ? [
              ['icon_label', 'Token (e.g. MU)', value.icon_label || ''],
              ['value', 'Value (e.g. 3.2x)', value.value || ''],
              ['description', 'Description', value.description || '']
            ]
          : [
              ['title', 'Step title', value.title || ''],
              ['description', 'Short description', value.description || '']
            ];

        fields.forEach(([name, placeholder, fieldValue]) => {
          const input = name === 'description' ? document.createElement('textarea') : document.createElement('input');
          input.dataset.field = name;
          input.placeholder = placeholder;
          input.value = fieldValue;
          row.appendChild(input);
        });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'btn-small danger';
        remove.textContent = 'Remove';
        remove.addEventListener('click', () => row.remove());
        row.appendChild(remove);
        container.appendChild(row);
      }

      function renderRepeatableRows(containerId, type, values = []) {
        document.getElementById(containerId).replaceChildren();
        values.forEach(value => addRepeatableRow(containerId, type, value));
      }

      function collectRepeatableRows(containerId, requiredFields, label) {
        return [...document.querySelectorAll(`#${containerId} .repeatable-row`)].reduce((items, row) => {
          const item = Object.fromEntries(requiredFields.map(field => [field, row.querySelector(`[data-field="${field}"]`).value.trim()]));
          if (!requiredFields.some(field => item[field])) return items;
          if (requiredFields.some(field => !item[field])) throw new Error(`${label} rows need every field completed or removed.`);
          items.push(item);
          return items;
        }, []);
      }

      document.getElementById('add-process-step').addEventListener('click', () => addRepeatableRow('work-process-steps', 'process'));
      document.getElementById('add-outcome').addEventListener('click', () => addRepeatableRow('work-outcomes', 'outcome'));

      // Fetch and Render Work
      async function loadWork() {
        const { data, error } = await supabase.from('work_items').select('*').order('order', { ascending: true });
        const list = document.getElementById('work-list');
        if (error) { list.innerHTML = `<p style="color:red">Error: ${error.message}</p>`; return; }
        
        list.innerHTML = data.length ? data.map(item => `
          <div class="list-item">
            <div>
              <h4>${item.title} ${item.is_large ? '<span style="font-size:12px; color:var(--blue)">(Large)</span>' : ''}</h4>
              <p>${item.tag_line}</p>
              <p>Order: ${item.order}</p>
            </div>
            <div class="actions-btn">
              <button class="btn-small" onclick='editWork(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit</button>
              <button class="btn-small danger" onclick="deleteWork('${item.id}')">Delete</button>
            </div>
          </div>
        `).join('') : '<p>No work items found.</p>';
      }

      // Fetch and Render Experience
      async function loadExp() {
        const { data, error } = await supabase.from('experience_items').select('*').order('order', { ascending: true });
        const list = document.getElementById('exp-list');
        if (error) { list.innerHTML = `<p style="color:red">Error: ${error.message}</p>`; return; }
        
        list.innerHTML = data.length ? data.map(item => `
          <div class="list-item">
            <div>
              <h4>${item.title}</h4>
              <p>${item.date_range}</p>
              <p>Order: ${item.order}</p>
            </div>
            <div class="actions-btn">
              <button class="btn-small" onclick='editExp(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit</button>
              <button class="btn-small danger" onclick="deleteExp('${item.id}')">Delete</button>
            </div>
          </div>
        `).join('') : '<p>No experience items found.</p>';
      }

      loadWork();
      loadExp();

      // Form Submits
      document.getElementById('work-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('work-id').value;
        let processSteps;
        let outcomes;
        try {
          processSteps = collectRepeatableRows('work-process-steps', ['title', 'description'], 'Process step');
          outcomes = collectRepeatableRows('work-outcomes', ['icon_label', 'value', 'description'], 'Outcome');
        } catch (error) {
          alert(error.message);
          return;
        }
        const reviewUrlVal = document.getElementById('work-review-url')?.value?.trim();
        const payload = {
          order: parseInt(document.getElementById('work-order').value),
          tag_line: document.getElementById('work-tag').value,
          title: document.getElementById('work-title').value,
          description: document.getElementById('work-desc').value,
          is_large: document.getElementById('work-large').checked,
          link_url: document.getElementById('work-link-url').value,
          link_label: document.getElementById('work-link-label').value,
          client_name: document.getElementById('work-client').value,
          overview: document.getElementById('work-overview').value,
          challenge_text: document.getElementById('work-challenge').value,
          approach_text: document.getElementById('work-approach').value,
          duration: document.getElementById('work-duration').value,
          live_site_url: document.getElementById('work-live-url').value,
          process_steps: processSteps,
          outcomes,
        };

        if (reviewUrlVal) {
          payload.review_url = reviewUrlVal;
        }
        
        let saveError = null;
        if (id) {
          let res = await supabase.from('work_items').update(payload).eq('id', id);
          if (res.error && res.error.message && res.error.message.includes('review_url')) {
            delete payload.review_url;
            res = await supabase.from('work_items').update(payload).eq('id', id);
          }
          saveError = res.error;
          if (saveError) alert('Error updating work: ' + saveError.message);
        } else {
          let res = await supabase.from('work_items').insert(payload);
          if (res.error && res.error.message && res.error.message.includes('review_url')) {
            delete payload.review_url;
            res = await supabase.from('work_items').insert(payload);
          }
          saveError = res.error;
          if (saveError) alert('Error inserting work: ' + saveError.message);
        }

        if (!saveError) {
          resetWorkForm();
          loadWork();
        }
      });

      document.getElementById('exp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('exp-id').value;
        const payload = {
          order: parseInt(document.getElementById('exp-order').value),
          date_range: document.getElementById('exp-date').value,
          title: document.getElementById('exp-title').value,
          description: document.getElementById('exp-desc').value,
        };
        
        if (id) {
          const { error } = await supabase.from('experience_items').update(payload).eq('id', id);
          if (error) alert('Error updating experience: ' + error.message);
        } else {
          const { error } = await supabase.from('experience_items').insert(payload);
          if (error) alert('Error inserting experience: ' + error.message);
        }
        resetExpForm();
        loadExp();
      });

      // Global functions for inline onclick handlers
      window.editWork = (item) => {
        document.getElementById('work-form-title').innerText = 'Edit Work';
        document.getElementById('work-id').value = item.id;
        document.getElementById('work-order').value = item.order;
        document.getElementById('work-tag').value = item.tag_line;
        document.getElementById('work-title').value = item.title;
        document.getElementById('work-desc').value = item.description;
        document.getElementById('work-large').checked = item.is_large;
        document.getElementById('work-link-url').value = item.link_url || '';
        document.getElementById('work-link-label').value = item.link_label || '';
        document.getElementById('work-client').value = item.client_name || item.client || '';
        document.getElementById('work-overview').value = item.overview || item.overview_text || '';
        document.getElementById('work-challenge').value = item.challenge_text || '';
        document.getElementById('work-approach').value = item.approach_text || '';
        document.getElementById('work-duration').value = item.duration || '';
        document.getElementById('work-live-url').value = item.live_site_url || '';
        document.getElementById('work-review-url').value = item.review_url || '';
        renderRepeatableRows('work-process-steps', 'process', Array.isArray(item.process_steps) ? item.process_steps : []);
        renderRepeatableRows('work-outcomes', 'outcome', Array.isArray(item.outcomes) ? item.outcomes : []);
        // Scroll to form smoothly
        document.getElementById('work-form').closest('.form-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      window.resetWorkForm = () => {
        document.getElementById('work-form-title').innerText = 'Add New Work';
        document.getElementById('work-form').reset();
        document.getElementById('work-id').value = '';
        renderRepeatableRows('work-process-steps', 'process');
        renderRepeatableRows('work-outcomes', 'outcome');
      };

      window.deleteWork = async (id) => {
        if(confirm('Are you sure you want to delete this?')) {
          const { error } = await supabase.from('work_items').delete().eq('id', id);
          if (error) alert('Error deleting work: ' + error.message);
          loadWork();
        }
      };

      window.editExp = (item) => {
        document.getElementById('exp-form-title').innerText = 'Edit Experience';
        document.getElementById('exp-id').value = item.id;
        document.getElementById('exp-order').value = item.order;
        document.getElementById('exp-date').value = item.date_range;
        document.getElementById('exp-title').value = item.title;
        document.getElementById('exp-desc').value = item.description;
        // Scroll to form smoothly
        document.getElementById('exp-form').closest('.form-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      window.resetExpForm = () => {
        document.getElementById('exp-form-title').innerText = 'Add New Experience';
        document.getElementById('exp-form').reset();
        document.getElementById('exp-id').value = '';
      };

      window.deleteExp = async (id) => {
        if(confirm('Are you sure you want to delete this?')) {
          const { error } = await supabase.from('experience_items').delete().eq('id', id);
          if (error) alert('Error deleting experience: ' + error.message);
          loadExp();
        }
      };
    });

    // Bullet point toolbar helpers (global scope)
    window.insertBullet = (textareaId) => {
      const ta = document.getElementById(textareaId);
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const value = ta.value;
      // Insert '• ' at cursor; if at start of a line, just prepend
      const before = value.substring(0, start);
      const after = value.substring(end);
      const needsNewline = before.length > 0 && !before.endsWith('\n');
      const insert = (needsNewline ? '\n' : '') + '\u2022 ';
      ta.value = before + insert + after;
      const newPos = start + insert.length;
      ta.setSelectionRange(newPos, newPos);
      ta.focus();
    };

    window.formatAsBullets = (textareaId) => {
      const ta = document.getElementById(textareaId);
      const lines = ta.value.split('\n');
      ta.value = lines
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          // Remove existing bullet symbols and dashes before re-adding
          const cleaned = line.replace(/^[•\-\*]\s*/, '').trim();
          return '\u2022 ' + cleaned;
        })
        .join('\n');
      ta.focus();
    };

    window.clearBullets = (textareaId) => {
      const ta = document.getElementById(textareaId);
      const lines = ta.value.split('\n');
      ta.value = lines
        .map(line => line.replace(/^[•\-\*]\s*/, '').trim())
        .join('\n');
      ta.focus();
    };
  </script>
</body>
</html>
